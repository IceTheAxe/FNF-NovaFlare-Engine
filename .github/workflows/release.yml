name: Release

on:
  workflow_dispatch:
    inputs:
      version_input:
        description: '输入格式为"版本名 版本号"，例如：1.2.0-Dev 2.7'
        required: true
        default: ''
      replace_existing_release:
        description: '替换同版本的 Release 和附件，保留原有标题、说明及发布状态'
        required: false
        type: boolean
        default: false
      original_release_metadata:
        description: '重建已删除的 Release 时，传入此前备份的元数据 JSON'
        required: false
        type: string
        default: ''

permissions:
  contents: write

env:
  PROJECT_NAME: NovaFlareEngine

jobs:
  update-versions:
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.parse-version.outputs.version_name }}
      version_number: ${{ steps.parse-version.outputs.version_number }}
      version_number_int_with_timestamp: ${{ steps.parse-version.outputs.version_number_int_with_timestamp }}
      commit_sha: ${{ steps.commit-version.outputs.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Parse version input
        id: parse-version
        run: |
          set -euo pipefail
          input="${{ github.event.inputs.version_input }}"
          version_name=$(echo "$input" | awk '{print $1}')
          version_number=$(echo "$input" | awk '{print $2}')
          commit_sha=$(git rev-parse --short HEAD)
          current_timestamp=$(date +%Y%m%d%H%M)

          version_number_int=$(echo "$version_number" | tr -d '.')
          current_date=$(date +%y%m%d)
          version_number_int_with_timestamp="${version_number_int}${current_date}"

          if [ -z "$version_name" ] || [ -z "$version_number" ]; then
            echo "::error::version_input 需要两个字段，格式：\"版本名 版本号\"，例如：1.2.0-Dev 2.7"
            exit 1
          fi

          echo "Parsed version name: $version_name"
          echo "Parsed version number: $version_number"
          echo "Version number without dots: $version_number_int"
          echo "Version number with timestamp: $version_number_int_with_timestamp"
          echo "Commit SHA: $commit_sha"

          echo "version_name=$version_name" >> $GITHUB_OUTPUT
          echo "version_number=$version_number" >> $GITHUB_OUTPUT
          echo "version_number_int_with_timestamp=$version_number_int_with_timestamp" >> $GITHUB_OUTPUT
          echo "commit_sha=$commit_sha" >> $GITHUB_OUTPUT

      - name: Update gitVersion.txt
        run: |
          set -euo pipefail
          echo "Updating gitVersion.txt..."
          echo "${{ steps.parse-version.outputs.version_name }}" > gitVersion.txt
          echo "${{ steps.parse-version.outputs.version_number }}" >> gitVersion.txt
          echo "Updated gitVersion.txt content:"
          cat gitVersion.txt

      - name: Update Project.xml
        run: |
          set -euo pipefail
          echo "Updating Project.xml..."
          if grep -q 'build-number="[0-9]*"' Project.xml; then
            sed -i "s/\(<app title=\"NovaFlare Engine\".* build-number=\"\)[0-9]*\(\"\)/\1${{ steps.parse-version.outputs.version_number_int_with_timestamp }}\2/" Project.xml
            echo "Updated existing build-number attribute with integer version and timestamp"
          else
            sed -i "s/\(<app title=\"NovaFlare Engine\".* version=\"[^\"]*\"\)/\1 build-number=\"${{ steps.parse-version.outputs.version_number_int_with_timestamp }}\"/" Project.xml
            echo "Added build-number attribute with integer version and timestamp"
          fi
          echo "Updated Project.xml version and build-number attributes"

      - name: Update MainMenuState.hx
        run: |
          set -euo pipefail
          echo "Updating MainMenuState.hx..."
          sed -i "s/\(public static var novaFlareEngineVersion:String = '\)[^']*/\1${{ steps.parse-version.outputs.version_name }}/" source/states/mainMenuState/MainMenuState.hx
          sed -i "s/\(public static var novaFlareEngineDataVersion:Float = \)[0-9.]*/\1${{ steps.parse-version.outputs.version_number }}/" source/states/mainMenuState/MainMenuState.hx
          echo "Updated MainMenuState.hx version variables"

      - name: Commit all changes
        id: commit-version
        run: |
          set -euo pipefail
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add gitVersion.txt Project.xml source/states/mainMenuState/MainMenuState.hx

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: Release version ${{ steps.parse-version.outputs.version_name }} ${{ steps.parse-version.outputs.version_number_int_with_timestamp }}"
            git push
          fi
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

  mobile-build:
    name: "Mobile Build (macOS 14)"
    needs: update-versions
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            buildArgs: windows
            artifactName: windows-x86_64
            artifactPath: export\release\windows\bin\*

          - name: Linux
            os: ubuntu-latest
            buildArgs: linux
            artifactName: linux-x86_64
            artifactPath: export/release/linux/bin/*

          - name: Linux ARM64
            os: ubuntu-latest
            buildArgs: linux -arm64 -D HXCPP_ARM64
            artifactName: linux-arm64
            artifactPath: export/release/linux/bin/*

          - name: macOS ARM64
            os: macos-latest
            buildArgs: mac -arm64 -D HXCPP_ARM64
            artifactName: macos-arm64
            artifactPath: export/release/macos/bin/*

          - name: macOS x86_64
            os: macos-26
            buildArgs: mac -64 -D HXCPP_M64
            artifactName: macos-x86_64
            artifactPath: export/release/macos/bin/*

          - name: Android
            os: macos-latest
            buildArgs: android
            artifactName: android-arm64
            artifactPath: export/release/android/bin/app/build/outputs/apk/release/*.apk

          - name: iOS
            os: macos-latest
            buildArgs: ios -arm64 -nosign
            artifactName: ios-arm64
            artifactPath: export/release/ios/build/Release-iphoneos/*.ipa
    # 这里不能写 continue-on-error。它在 uses: 型 job 上是**非法字段** ——
    # reusable workflow job 的键白名单只有
    # name / uses / with / secrets / strategy / needs / if / concurrency / permissions。
    # 写上去会让 GitHub 整块解析失败，报 "Unexpected value 'uses'" 加
    # "Required property is missing: runs-on"（它把这段当成普通 job 在解析）。
    uses: ./.github/workflows/build.yml
    with:
      name: ${{ matrix.name }}
      os: ${{ matrix.os }}
      buildArgs: ${{ matrix.buildArgs }}
      artifactName: ${{ matrix.artifactName }}
      artifactPath: ${{ matrix.artifactPath }}
      use_cache: false
      dependencies_to_update: ${{ inputs.dependencies_to_update }}
    # ★ 必须有这一行。secrets 不会自动穿透 uses: —— 少了它，内层 build.yml 读到的
    # NOVA_GA_GAME_KEY / NOVA_GA_SECRET_KEY 全是空串，check-gameanalytics-env.ps1
    # -Required 直接抛错。
    # 旧版 release.yml 调 MobileBuild.yml 时就带着 secrets: inherit，我重构时漏了。
    #
    # 另有 environment 优先级这一层（GitHub 文档明确警告）：workflow_call 不支持
    # environment 关键字，被调 workflow 的 job 上如果写了 environment，
    # **environment 的 secret 优先，调用方传来的会被忽略**。build.yml 里正是这样
    # 写的（environment: private-build），所以这行 inherit 在私有仓库上可能仍被
    # environment secret 覆盖 —— 两者取的都是本仓 private-build，同一份数据，
    # 行为一致；但如果哪天 private-build environment 被清空，会看到
    # "secret 是空的"而不是"没传进来"，排查时别误判方向。
    secrets: inherit

  releaser:
    name: Package and Publish
    needs: [update-versions, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION_NAME: ${{ needs.update-versions.outputs.version_name }}
    steps:
      - name: Download Windows build
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: windows-x86_64
          path: artifacts/windows-x86_64

      - name: Download Linux build
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: linux-x86_64
          path: artifacts/linux-x86_64

      - name: Download Linux ARM64 build
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: linux-arm64
          path: artifacts/linux-arm64

      - name: Download macOS ARM64 build
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: macos-arm64
          path: artifacts/macos-arm64

      - name: Download macOS x86_64 build
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: macos-x86_64
          path: artifacts/macos-x86_64

      - name: Download Android build
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: android-arm64
          path: artifacts/android

      - name: Download iOS build
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ios-arm64
          path: artifacts/ios

      - name: Assemble release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

      - name: Prepare release metadata
        id: release-metadata
        uses: actions/github-script@v9
        env:
          RELEASE_TAG: "V${{ needs.update-versions.outputs.version_name }}"
          REPLACE_EXISTING: "${{ inputs.replace_existing_release }}"
          ORIGINAL_RELEASE_METADATA: ${{ inputs.original_release_metadata }}
        with:
          script: |
            const fs = require('fs');
            const tag = process.env.RELEASE_TAG;
            const replace = process.env.REPLACE_EXISTING === 'true';
            core.setOutput('name', tag);
            core.setOutput('draft', 'false');
            core.setOutput('prerelease', 'false');
            if (!replace) return;

            const expected = ['android.zip', 'ios.zip', 'linux.zip', 'macOS-14.zip', 'macOS-15.zip', 'windows.zip'];
            for (const name of expected) {
              if (!fs.existsSync(`artifacts/${name}`) || fs.statSync(`artifacts/${name}`).size === 0) {
                throw new Error(`Missing or empty replacement asset: ${name}`);
              }
            }
            let release;
            let isLatest = false;
            if (process.env.ORIGINAL_RELEASE_METADATA) {
              const backup = JSON.parse(process.env.ORIGINAL_RELEASE_METADATA);
              release = backup.release;
              isLatest = backup.isLatest === true;
            } else {
              ({data: release} = await github.rest.repos.getReleaseByTag({...context.repo, tag}));
              try {
                const {data: latest} = await github.rest.repos.getLatestRelease(context.repo);
                isLatest = latest.id === release.id;
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
            if (release?.tag_name !== tag || typeof release.draft !== 'boolean' || typeof release.prerelease !== 'boolean') {
              throw new Error('Original release metadata does not match the requested tag');
            }
            if (release.immutable) throw new Error('Cannot replace an immutable release');
            for (const asset of release.assets) {
              if (!expected.includes(asset.name)) throw new Error(`No replacement for existing asset: ${asset.name}`);
            }
            fs.writeFileSync('release-original.json', JSON.stringify({release, isLatest}, null, 2));
            core.setOutput('name', release.name ?? tag);
            core.setOutput('body', release.body ?? '');
            core.setOutput('draft', String(release.draft));
            core.setOutput('prerelease', String(release.prerelease));

      - name: Back up original release metadata
        if: inputs.replace_existing_release
        uses: actions/upload-artifact@v4
        with:
          name: original-release-metadata
          path: release-original.json
          if-no-files-found: error
          retention-days: 30

      - name: Recreate replacement release as a draft
        if: inputs.replace_existing_release
        uses: actions/github-script@v9
        env:
          BUILD_SHA: ${{ needs.update-versions.outputs.commit_sha }}
        with:
          script: |
            const fs = require('fs');
            const {release} = JSON.parse(fs.readFileSync('release-original.json', 'utf8'));
            try {
              await github.rest.repos.deleteRelease({...context.repo, release_id: release.id});
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            let tagExists = true;
            try {
              await github.rest.git.getRef({...context.repo, ref: `tags/${release.tag_name}`});
            } catch (error) {
              if (error.status !== 404) throw error;
              tagExists = false;
            }
            if (tagExists) await github.rest.git.deleteRef({...context.repo, ref: `tags/${release.tag_name}`});
            await github.rest.git.createRef({
              ...context.repo, ref: `refs/tags/${release.tag_name}`, sha: process.env.BUILD_SHA
            });
            const {data: replacement} = await github.rest.repos.createRelease({
              ...context.repo, tag_name: release.tag_name, target_commitish: process.env.BUILD_SHA,
              name: release.name, body: release.body, draft: true, prerelease: release.prerelease,
              generate_release_notes: false, make_latest: 'false'
            });
            fs.writeFileSync('release-replacement.json', JSON.stringify({id: replacement.id}));

      - name: Publish The Release
        uses: softprops/action-gh-release@v3
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"
          prerelease: ${{ steps.release-metadata.outputs.prerelease == 'true' }}
          draft: ${{ inputs.replace_existing_release || steps.release-metadata.outputs.draft == 'true' }}
          tag_name: "V${{ needs.update-versions.outputs.version_name }}"
          target_commitish: ${{ needs.update-versions.outputs.commit_sha }}
          name: ${{ steps.release-metadata.outputs.name }}
          body: ${{ steps.release-metadata.outputs.body }}
          files: |
            artifacts/*.zip
          fail_on_unmatched_files: true

      - name: Restore replacement release publication state
        if: inputs.replace_existing_release
        uses: actions/github-script@v9
        env:
          BUILD_SHA: ${{ needs.update-versions.outputs.commit_sha }}
        with:
          script: |
            const fs = require('fs');
            const {release, isLatest} = JSON.parse(fs.readFileSync('release-original.json', 'utf8'));
            const {id} = JSON.parse(fs.readFileSync('release-replacement.json', 'utf8'));
            const {data: replacement} = await github.rest.repos.getRelease({...context.repo, release_id: id});
            const expected = ['android.zip', 'ios.zip', 'linux.zip', 'macOS-14.zip', 'macOS-15.zip', 'windows.zip'];
            if (expected.some(name => !replacement.assets.some(asset => asset.name === name && asset.size > 0 && asset.state === 'uploaded'))) {
              throw new Error('Replacement assets are incomplete; leaving the release as a draft');
            }
            const {data: tagRef} = await github.rest.git.getRef({...context.repo, ref: `tags/${release.tag_name}`});
            if (tagRef.object.sha !== process.env.BUILD_SHA) {
              throw new Error('Release tag does not point to the build commit; leaving the release as a draft');
            }
            await github.rest.repos.updateRelease({
              ...context.repo, release_id: id, name: release.name, body: release.body,
              draft: release.draft, prerelease: release.prerelease, make_latest: isLatest ? 'true' : 'false'
            });
