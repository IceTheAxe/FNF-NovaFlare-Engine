name: Mobile Build

# 只编移动端（Android + iOS），产物留在 artifact 里，不发布。
# 日常 push/PR 的全平台 CI 已经由 build-all.yml 统一负责，不再由本文件承担 ——
# 旧版这里挂着 push/PR 触发器，会和 build-all.yml 重复跑一遍 Android/iOS。
#
# 保留这个文件是因为"只想快速验一下移动端"是个真实需求：全平台矩阵在 PR 上要占
# 7 个 runner，移动端两个目标几分钟就能出结果。
#
# 和 release.yml 的区别：use_cache=true（走缓存），且没有 pack / release 步骤。

on:
  workflow_dispatch:
    inputs:
      dependencies_to_update:
        description: '输入 "all" 强制重装所有 haxelib，也可指定单个或多个库(e.g. "lime openfl flixel")；留空则完全走缓存'
        required: false
        default: ''

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Android
            os: macos-latest
            buildArgs: android
            artifactName: mobile-android-arm64
            artifactPath: export/release/android/bin/app/build/outputs/apk/release/*.apk

          - name: iOS
            os: macos-latest
            buildArgs: ios -arm64 -nosign
            artifactName: mobile-ios-arm64
            artifactPath: export/release/ios/build/Release-iphoneos/*.ipa
    uses: ./.github/workflows/build.yml
    with:
      name: ${{ matrix.name }}
      os: ${{ matrix.os }}
      buildArgs: ${{ matrix.buildArgs }}
      artifactName: ${{ matrix.artifactName }}
      artifactPath: ${{ matrix.artifactPath }}
      use_cache: true
      dependencies_to_update: ${{ inputs.dependencies_to_update }}
    # 移动端必须要 analytics（它是 GameAnalytics 的主要使用方），所以这里必须传。
    # 漏了会让 check-gameanalytics-env.ps1 -Required 在内层失败。
    secrets: inherit
