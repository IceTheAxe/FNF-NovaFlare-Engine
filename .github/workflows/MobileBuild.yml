name: Mobile Build

# 只编移动端（Android + iOS），产物留在 artifact 里，不发布。
# 2026-11-20 起角色互换：日常 push 到 main 由本工作流承担（移动端两个目标几分钟
# 就能出结果），全平台矩阵退到 PR / 手动触发（build-all.yml）。
#
# 和 release.yml 的区别：use_cache=true（走缓存），且没有 pack / release 步骤。

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/'
      - 'example_mods/'
      - 'README.md'
      - '.github/workflows/hxcpp-cache.yml'
  workflow_dispatch:
    inputs:
      dependencies_to_update:
        description: '输入 "all" 强制重装所有 haxelib，也可指定单个或多个库(e.g. "lime openfl flixel")；留空则完全走缓存'
        required: false
        default: ''

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Android
            os: macos-latest
            buildArgs: android
            artifactName: mobile-android-arm64
            artifactPath: export/release/android/bin/app/build/outputs/apk/release/*.apk

          - name: iOS
            os: macos-latest
            buildArgs: ios -arm64 -nosign
            artifactName: mobile-ios-arm64
            artifactPath: export/release/ios/build/Release-iphoneos/*.ipa
    uses: ./.github/workflows/build.yml
    with:
      name: ${{ matrix.name }}
      os: ${{ matrix.os }}
      buildArgs: ${{ matrix.buildArgs }}
      artifactName: ${{ matrix.artifactName }}
      artifactPath: ${{ matrix.artifactPath }}
      use_cache: true
      dependencies_to_update: ${{ inputs.dependencies_to_update }}
    # 仍然要显式传：secrets 不会自动穿透 uses:。
    # GameAnalytics 现在是可选的 —— 没有 key 时内层自动禁用 analytics，构建照常出包。
    # 但配了 key 的正式发布构建要能把凭据送进去，漏了这一行会静默退化成"analytics 未启用"。
    secrets: inherit
