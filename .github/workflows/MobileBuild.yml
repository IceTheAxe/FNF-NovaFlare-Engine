name: MobileBuild
on:
  workflow_call:
    inputs:
      dependencies_to_update:
        description: '输入 "all" 更新所有haxelib, 或指定库名 (e.g. "lime,openfl")不输入即不给haxelib做任何更新'
        required: false
        type: string
        default: ''
      
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/'
      - 'example_mods/'
      - 'README.md'
  pull_request:
    branches: [ main ]
    
  workflow_dispatch:
    inputs:
      dependencies_to_update:
        description: '输入 "all" 更新所有haxelib, 也可以输入单个或多个haxelib单独更新他们(e.g. "lime openfl flixel"),不输入即不给haxelib做任何更新'
        required: false
        default: ''
        
jobs: 
  Android:
    runs-on: macos-14
    environment: ${{ github.repository == 'IceTheAxe/FNF-NovaFlare-Engine' && github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'private-build' || 'public-build' }}
    concurrency:
      group: ${{ github.workflow }}-Android-${{ github.ref }}

    steps:
      - name: Checkout
        uses: actions/checkout@main
        
      - name: Setup Android NDK
        uses: nttld/setup-ndk@main
        id: setup-ndk
        with:
          ndk-version: r28c
          # 不让 action 往 PATH 里塞工具链：NDK 路径统一由下面的 Export/Configure
          # 显式传给 hxcpp 和 lime，避免 runner 预装的 r27d 混进来。
          add-to-path: false

      # hxcpp 从**进程环境**读 ANDROID_NDK_ROOT：BuildTool.hx:1522 把整个 env 灌进
      # defines，Setup.hx:417 见它已存在就直接用、不再探测。而 runner 镜像预置了
      # ANDROID_NDK_ROOT=.../ndk/27.3.13750724（r27d），r27 及以下默认链接出 4 KB
      # 对齐的 .so，在 16 KB 页大小的 Android 15+ 设备上 dlopen 会失败。
      # 这里把它覆盖成 setup-ndk 装的 r28c（16 KB 对齐是 r28 起的默认值）。
      - name: Export Android NDK
        run: |
          echo "ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV
          echo "ANDROID_NDK=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV

      # 光靠 r28 的默认还不够。实测 NDK r28c 只默认设了 max-page-size（决定 LOAD 段的
      # p_align），没有设 common-page-size（决定 GNU_RELRO 段末端是否落在 16 KB 边界）。
      # 官方对 RELRO 的规则是 (VirtAddr + MemSiz) % 0x4000 == 0，不满足会在运行时
      # 段错误。hxcpp 没有传链接参数的命令行入口，唯一的注入点是 $HOME/.hxcpp_config.xml。
      - name: Force 16 KB linker flags for hxcpp
        run: |
          printf '%s\n' \
            '<xml>' \
            '  <section id="exes">' \
            '    <linker id="dll" if="android">' \
            '      <flag value="-Wl,-z,max-page-size=16384"/>' \
            '      <flag value="-Wl,-z,common-page-size=16384"/>' \
            '    </linker>' \
            '  </section>' \
            '</xml>' > "$HOME/.hxcpp_config.xml"
          cat "$HOME/.hxcpp_config.xml"

      - name: Setup Java JDK
        uses: actions/setup-java@main
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.7

      - name: Restore private GameAnalytics
        if: github.repository == 'IceTheAxe/FNF-NovaFlare-Engine' && github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        shell: pwsh
        env:
          NOVA_GA_IMPL_B64: ${{ secrets.NOVA_GA_IMPL_B64 }}
          NOVA_GA_TYPES_B64: ${{ secrets.NOVA_GA_TYPES_B64 }}
          NOVA_GA_CONFIG_B64: ${{ secrets.NOVA_GA_CONFIG_B64 }}
        run: ./tools/restore-private-gameanalytics.ps1 -Required
              
      - name: Determine Android cache strategy
        id: android_cache
        run: |
          if [[ "${{ inputs.dependencies_to_update }}" == "all" ]] || \
             [[ "${{ inputs.dependencies_to_update }}" == "android" ]]; then
            echo "跳过缓存：需要更新所有或Android依赖"
            echo "skip_cache=true" >> $GITHUB_OUTPUT
            echo "update_libs=true" >> $GITHUB_OUTPUT
          elif [[ -n "${{ inputs.dependencies_to_update }}" && "${{ inputs.dependencies_to_update }}" != "ios" ]]; then
            echo "使用缓存：仅更新指定依赖"
            echo "skip_cache=false" >> $GITHUB_OUTPUT
            echo "update_libs=true" >> $GITHUB_OUTPUT
            echo "libs_to_update=${{ inputs.dependencies_to_update }}" >> $GITHUB_OUTPUT
          else
            echo "使用缓存：无需更新依赖"
            echo "skip_cache=false" >> $GITHUB_OUTPUT
            echo "update_libs=false" >> $GITHUB_OUTPUT
          fi

      - name: Restore Android cache
        if: steps.android_cache.outputs.skip_cache == 'false'
        uses: actions/cache/restore@v4
        with:
          key: cache-build-Android
          restore-keys: |
            cache-build-Android
          path: |
            .haxelib/
            export/legacy-gc/android/
            ~/.gradle
            
      - name: Install Android Libraries
        run: |
          haxelib setup ~/haxelib
          haxelib --global install hmm --quiet
          haxelib --global run hmm install
          # A cached haxelib git checkout can drift to the upstream default
          # branch even when hmm.json pins a commit. Restore every immutable
          # dependency plus NovaFlare's compatibility fork before compilation.
          for library in polymod thx.core thx.semver FlxPartialSound; do
            haxelib --global run hmm reinstall --force "$library"
          done
          
          if [ "${{ steps.android_cache.outputs.update_libs }}" == "true" ]; then
            if [ "${{ steps.android_cache.outputs.skip_cache }}" == "true" ]; then
              echo "强制重新安装所有Android依赖..."
            elif [ -n "${{ steps.android_cache.outputs.libs_to_update }}" ]; then
              echo "更新指定Android依赖: ${{ steps.android_cache.outputs.libs_to_update }}"
              haxelib --global install hmm
              haxelib --global run hmm reinstall --force $(echo "${{ steps.android_cache.outputs.libs_to_update }}")
            fi
          else
            echo "使用缓存，无需安装依赖"
          fi

      - name: Configure Android
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          # 必须写 setup-ndk 的输出，不能写 $ANDROID_NDK_HOME —— 镜像预置的那个是 r27d。
          # lime 会把这个值经 project.environment 回灌进进程环境（HXProject.hx:501），
          # 而 hxcpp 正是从进程环境取 ANDROID_NDK_ROOT 的；写错这里等于用 r27d 链接，
          # 编出来的 libApplicationMain.so 只有 4 KB 段对齐。
          haxelib run lime config ANDROID_NDK_ROOT ${{ steps.setup-ndk.outputs.ndk-path }}
          haxelib run lime config JAVA_HOME $JAVA_HOME
          haxelib run lime config ANDROID_SETUP true
            
      - name: Extract current version
        id: get_version
        run: |
          CURRENT_VERSION=$(sed -n 's/.*build-number="\([^"]*\)".*/\1/p' Project.xml)
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT

      - name: Compile Android
        run: |
          COMMIT_SHA=$(git rev-parse --short HEAD)
          CURRENT_VERSION="${{ steps.get_version.outputs.current_version }}"
    
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            NEW_VERSION="${CURRENT_VERSION/-dev/-$COMMIT_SHA}"
            haxelib run lime build android -Dlegacy_gc_compare -Dcommit_sha=$COMMIT_SHA -Dbuild_number=$NEW_VERSION
          else
            haxelib run lime build android -Dlegacy_gc_compare -Dcommit_sha=$COMMIT_SHA -Dbuild_number=$CURRENT_VERSION
          fi

      # 16 KB 页大小的 Android 15+ 设备要求每个 .so 的 ELF LOAD 段按 16384 对齐，
      # 否则装载时直接报 "program alignment (4096) cannot be smaller than system
      # page size (16384)"。链接用的 NDK 一旦回退到 r27 及以下就会复现，所以在这里
      # 拦住，不要留到装真机的时候才发现。
      - name: Verify 16 KB page alignment
        run: |
          set -e
          shopt -s nullglob

          APK=$(ls export/legacy-gc/android/bin/app/build/outputs/apk/release/*.apk | head -1)
          READELF=$(ls "$ANDROID_NDK_ROOT"/toolchains/llvm/prebuilt/*/bin/llvm-readelf | head -1)
          echo "APK: $APK"
          echo "NDK: $ANDROID_NDK_ROOT"

          rm -rf /tmp/so-check && mkdir -p /tmp/so-check
          unzip -o -q "$APK" 'lib/arm64-v8a/*.so' -d /tmp/so-check

          files=(/tmp/so-check/lib/arm64-v8a/*.so)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::APK 里没有 lib/arm64-v8a/*.so"
            exit 1
          fi

          status=0
          for so in "${files[@]}"; do
            name=$(basename "$so")
            dump=$("$READELF" -Wl "$so")

            # LOAD 段的 p_align 必须 >= 2**14，否则 16 KB 设备上 dlopen 直接失败。
            # 四个 .so 里只有 libApplicationMain.so 是这次构建自己链出来的，其余三个
            # （liblime / libvlc / libc++_shared）都是随 haxelib 和 NDK 发下来的预编译
            # 产物；一起查是为了别人换了预编译包时也能发现。
            loads=$(echo "$dump" | awk '/^  LOAD/{print $NF}' | sort -u)
            echo "$name  LOAD align: $(echo $loads)"
            for a in $loads; do
              if [ "$((a))" -lt 16384 ]; then
                echo "::error::$name 的 LOAD 段对齐 $a < 16384，16 KB 设备上会 dlopen 失败"
                status=1
              fi
            done

            # GNU_RELRO 的官方要求是 (VirtAddr + MemSiz) % 0x4000 == 0，不满足会在运行时
            # 段错误。这里只告警不拦截：同门的 Frozen Engine Mobile 产出的
            # libApplicationMain.so 余数是 12288，实测能跑，说明这条在实机上不总是致命，
            # 不该因为它挡住发布。上面 .hxcpp_config.xml 里的 common-page-size 就是冲它
            # 去的，正常情况下这里不该有输出。
            relro=$(echo "$dump" | awk '/GNU_RELRO/{print $3, $6}')
            if [ -n "$relro" ]; then
              set -- $relro
              rem=$(( ($(( $1 )) + $(( $2 ))) % 16384 ))
              if [ "$rem" -ne 0 ]; then
                echo "::warning::$name 的 RELRO 末端未落在 16 KB 边界（余 $rem）"
              fi
            fi
          done
          exit $status

      - name: Create Android zip package
        run: |
          cd export/legacy-gc/android/bin/app/build/outputs/apk/release/
          zip -r android.zip *.apk

      - name: Create Haxelib zip package
        run: |
          zip -r /Users/runner/haxelib.zip .haxelib/

      - name: Upload Android Artifact
        uses: actions/upload-artifact@main
        with:
          name: androidBuild
          path: export/legacy-gc/android/bin/app/build/outputs/apk/release/android.zip
          if-no-files-found: error

      - name: Upload Haxelib Artifact
        uses: actions/upload-artifact@main
        with:
          name: Haxelib
          path: /Users/runner/haxelib.zip
          if-no-files-found: error
  
      - name: Save Android cache
        uses: actions/cache/save@v4
        with:
          key: cache-build-Android
          path: |
            .haxelib/
            export/legacy-gc/android/
            ~/.gradle
          
  iOS:
    runs-on: macos-15
    environment: ${{ github.repository == 'IceTheAxe/FNF-NovaFlare-Engine' && github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'private-build' || 'public-build' }}
    concurrency:
      group: ${{ github.workflow }}-iOS-${{ github.ref }}

    steps:
      - name: Checkout
        uses: actions/checkout@main
        
      - name: Select Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'
  
      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.7

      - name: Restore private GameAnalytics
        if: github.repository == 'IceTheAxe/FNF-NovaFlare-Engine' && github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        shell: pwsh
        env:
          NOVA_GA_IMPL_B64: ${{ secrets.NOVA_GA_IMPL_B64 }}
          NOVA_GA_TYPES_B64: ${{ secrets.NOVA_GA_TYPES_B64 }}
          NOVA_GA_CONFIG_B64: ${{ secrets.NOVA_GA_CONFIG_B64 }}
        run: ./tools/restore-private-gameanalytics.ps1 -Required
   
      - name: Determine iOS cache strategy
        id: ios_cache
        run: |
          if [[ "${{ inputs.dependencies_to_update }}" == "all" ]] || \
             [[ "${{ inputs.dependencies_to_update }}" == "ios" ]]; then
            echo "跳过缓存：需要更新所有或iOS依赖"
            echo "skip_cache=true" >> $GITHUB_OUTPUT
            echo "update_libs=true" >> $GITHUB_OUTPUT
          elif [[ -n "${{ inputs.dependencies_to_update }}" && "${{ inputs.dependencies_to_update }}" != "android" ]]; then
            echo "使用缓存：仅更新指定依赖"
            echo "skip_cache=false" >> $GITHUB_OUTPUT
            echo "update_libs=true" >> $GITHUB_OUTPUT
            echo "libs_to_update=${{ inputs.dependencies_to_update }}" >> $GITHUB_OUTPUT
          else
            echo "使用缓存：无需更新依赖"
            echo "skip_cache=false" >> $GITHUB_OUTPUT
            echo "update_libs=false" >> $GITHUB_OUTPUT
          fi
                
      - name: Restore iOS cache
        if: steps.ios_cache.outputs.skip_cache == 'false'
        uses: actions/cache/restore@v4
        with:
          enableCrossOsArchive: true
          key: cache-build-iOS
          restore-keys: |
            cache-build-iOS
          path: |
            .haxelib/
            export/legacy-gc/ios/
          
      - name: Install iOS Libraries
        run: |
          haxelib setup ~/haxelib
          haxelib --global install hmm --quiet
          haxelib --global run hmm install
          # Restore pinned commits after haxelib has touched cached git clones.
          for library in polymod thx.core thx.semver FlxPartialSound; do
            haxelib --global run hmm reinstall --force "$library"
          done
          
          if [ "${{ steps.ios_cache.outputs.update_libs }}" == "true" ]; then
            if [ "${{ steps.ios_cache.outputs.skip_cache }}" == "true" ]; then
              echo "强制重新安装所有iOS依赖..."
            elif [ -n "${{ steps.ios_cache.outputs.libs_to_update }}" ]; then
              echo "更新指定iOS依赖: ${{ steps.ios_cache.outputs.libs_to_update }}"
              haxelib --global install hmm
              haxelib --global run hmm reinstall --force $(echo "${{ steps.ios_cache.outputs.libs_to_update }}")
            fi
          else
            echo "使用缓存，无需安装依赖"
          fi

          echo "lime revision: $(git -C .haxelib/lime/git rev-parse HEAD)"
          echo "openfl revision: $(git -C .haxelib/openfl/git rev-parse HEAD)"

      - name: Compile iOS
        run: haxelib run lime build ios -arm64 -nosign -Dlegacy_gc_compare -Dcommit_sha=$(git rev-parse --short HEAD)
        
      - name: Make IPA And iOS Zip
        run: |
          cd export/legacy-gc/ios/build/Release-iphoneos
          rm -rf Payload
          mkdir Payload
          mv *.app Payload
          zip -r NovaFlareEngine.ipa Payload

      - name: Create iOS zip package
        run: |
          cd export/legacy-gc/ios/build/Release-iphoneos/
          zip -r ios.zip *.ipa

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@main
        with:
          name: iOSBuild
          path: export/legacy-gc/ios/build/Release-iphoneos/ios.zip
          if-no-files-found: error
     
      - name: Save iOS cache
        uses: actions/cache/save@v4
        with:
          key: cache-build-iOS
          path: |
            .haxelib/
            export/legacy-gc/ios/
