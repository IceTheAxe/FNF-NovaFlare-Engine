name: LinuxBuild
on:
  workflow_dispatch:
  
  workflow_call:
  
jobs:
  build:
    name: LinuxBuild
    runs-on: ubuntu-24.04
    environment: ${{ github.repository == 'IceTheAxe/FNF-NovaFlare-Engine' && 'private-build' || 'public-build' }}
    env:
      NOVA_GA_GAME_KEY: ${{ github.repository == 'IceTheAxe/FNF-NovaFlare-Engine' && github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && secrets.NOVA_GA_GAME_KEY || '' }}
      NOVA_GA_SECRET_KEY: ${{ github.repository == 'IceTheAxe/FNF-NovaFlare-Engine' && github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && secrets.NOVA_GA_SECRET_KEY || '' }}
      NOVA_GA_REQUIRED: ''

    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.7

      - name: Check GameAnalytics credentials
        if: github.repository == 'IceTheAxe/FNF-NovaFlare-Engine' && github.event_name != 'pull_request' && github.event_name != 'pull_request_target'
        shell: pwsh
        run: ./tools/check-gameanalytics-env.ps1

      - name: Installing LibVLC
        run: |
          sudo apt-get install libvlc-dev libvlccore-dev
          
      - name: Install Libraries
        run: |
          haxelib setup ~/haxelib
          haxelib git hmm https://github.com/NovaFlare-Engine-haxelib/hmm-3.1.0 70aca779a9d374a6e6b83c18715a3991a147ca37 --skip-dependencies
          haxelib run hmm install
          
      - name: Extract current version
        id: get_version
        run: |
          CURRENT_VERSION=$(grep -oP 'build-number="\K[^"]*' Project.xml)
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
        
      - name: Compile
        run: |
          COMMIT_SHA=$(git rev-parse --short HEAD)
          CURRENT_VERSION="${{ steps.get_version.outputs.current_version }}"
            
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            NEW_VERSION="${CURRENT_VERSION/-dev/-$COMMIT_SHA}"
            haxelib run lime build linux -Dcommit_sha=$COMMIT_SHA -Dbuild_number=$NEW_VERSION
          else
            haxelib run lime build linux -Dcommit_sha=$COMMIT_SHA -Dbuild_number=$CURRENT_VERSION
          fi
          
      - name: Create Linux zip package
        run: |
          cd export/release/linux/bin/
          zip -r linux.zip .

      - name: Uploading artifact
        uses: actions/upload-artifact@v4
        with:
          name: LinuxBuild
          path: export/release/linux/bin/linux.zip
