name: Build

# 单个平台的构建 worker。整个仓库只有这一份"怎么编一个平台"的实现，
# 上层（build-all.yml / release.yml）只负责用 matrix 决定编哪些、并等待哪些产物。
#
# 设计要点（相对旧的 WindowsBuild/LinuxBuild/MacBuild/MobileBuild 各自一份）：
#
#  1) 平台差异全部收进 matrix 的 buildArgs，本文件里用 name 做
#     少量分支（iOS 要 IPA、Linux 要 libvlc），不再按平台拆文件。
#     加一个目标 = matrix 里加一行，不是一个新文件。
#
#  2) 缓存做成开关（use_cache），而不是像旧 MobileBuild 那样按 inputs 猜。
#     发布链走 use_cache=false 全量重编，CI 链走 use_cache=true。
#     理由和 FE 两个仓库一致：出 release 时宁可全量重编，也不想让缓存
#     成为发布产物的一个变量。
#
#  3) ★ 本 worker 不打包。旧流程里每个平台 job 自己 zip 一次，releaser 再把这些
#     zip 收集一遍，等于同一份字节压了两次；apk/ipa 还被套进第二层 zip
#     （android.zip 里装 apk、ios.zip 里装 ipa），用户下载后要先解一层才能装。
#     现在这里只上传"原始产物"（目录 / *.apk / *.ipa），压缩统一由 releaser 做一次，
#     且 apk/ipa 直接作为 release 附件，不再套 zip。见 release.yml 的 releaser。
#
#  4) 环境变量优先用 job/step env 而不是内联，pwsh 与 bash 都能读。
#     特别注意 HXCPP_COMPILE_CACHE 只走环境变量这一条通道：hxcpp 的
#     BuildTool.runMain() 开头会把 Sys.environment() 整个灌进 defines，环境变量本身就够；
#     再用 -D 传一遍在 Windows 上会被上游拼坏（值成了 "<路径>=<路径>"，
#     反斜杠还翻一倍），CompileCache.init() 建目录直接失败、缓存静默失效。
#     原理见 hxcpp-cache.yml 顶部。

on:
  workflow_call:
    inputs:
      name:
        description: '目标显示名，同时用于 job 名、缓存 key 的 slug、以及 release 附件名'
        required: true
        type: string
      os:
        required: true
        type: string
      buildArgs:
        description: '传给 lime build 的参数'
        required: true
        type: string
      artifactName:
        description: 'actions/upload-artifact 的 name，releaser 按它下载'
        required: true
        type: string
      artifactPath:
        description: '原始产物路径（目录或 glob），本 worker 原样上传，不压缩'
        required: true
        type: string
      use_cache:
        description: '是否启用 hxcpp 编译缓存 + haxelib 依赖缓存'
        required: false
        type: boolean
        default: false
      dependencies_to_update:
        description: '输入 "all" 强制重装所有 haxelib；留空则完全依赖缓存；也可指定库名'
        required: false
        type: string
        default: ''

env:
  HAXE_VERSION: 4.3.7
  PROJECT_NAME: NovaFlareEngine

jobs:
  build:
    name: ${{ inputs.name }}
    runs-on: ${{ inputs.os }}
    timeout-minutes: 180
    environment: ${{ github.repository == 'IceTheAxe/FNF-NovaFlare-Engine' && 'private-build' || 'public-build' }}

    env:
      # 设了它 hxcpp 才会用内容 hash 给 .obj 命名（跨机器命中就跳过编译）。
      # 机制与"两族 key"的说明见 .github/workflows/hxcpp-cache.yml 顶部。
      HXCPP_COMPILE_CACHE: ${{ github.workspace }}/.hxcpp_cache

      # GameAnalytics 凭据在编译期由 gameanalytics.GACompileConfig 宏从环境变量读取
      # （见 Project.xml 的 --macro gameanalytics.GACompileConfig.configure()）。
      # BuildTool.runMain() 开头会把 Sys.environment() 整个灌进 defines，所以这里
      # 只需保证变量在进程环境里可达。
      #
      # 凭据是可选的：没有 key 时 GAMEANALYTICS_ENABLED 不会被定义，
      # GABridge 的方法体编译为空实现，构建照常出包。
      # 要强制"缺 key 即失败"，把下面 NOVA_GA_REQUIRED 改成 '1'。
      NOVA_GA_GAME_KEY: ${{ github.repository == 'IceTheAxe/FNF-NovaFlare-Engine' && github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.NOVA_GA_GAME_KEY || '' }}
      NOVA_GA_SECRET_KEY: ${{ github.repository == 'IceTheAxe/FNF-NovaFlare-Engine' && github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.NOVA_GA_SECRET_KEY || '' }}
      NOVA_GA_REQUIRED: ''

    steps:
      - name: Checkout
        uses: actions/checkout@main

      # haxelib 的根目录在三个地方被用到（依赖缓存的 path、Install Libraries、
      # 诊断输出），先定下来再往下走。
      # Windows 上刻意用 C:/haxelib 这种正斜杠形式：Install Libraries 跑在 git bash 里，
      # 写成 C:\haxelib 的话 bash 会把 \h 当转义、haxelib 收到的是个错路径，
      # 依赖会装到别处，而依赖缓存仍然按 C:\haxelib 存取 —— 两边对不上，
      # 缓存看着命中了其实等于没命中。Windows 的 API 认正斜杠，这里没有理由用反斜杠。
      - name: Resolve haxelib root
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            HAXELIB_ROOT="C:/haxelib"
          else
            HAXELIB_ROOT="$HOME/haxelib"
          fi
          echo "HAXELIB_ROOT=$HAXELIB_ROOT" >> "$GITHUB_ENV"
          echo "haxelib root: $HAXELIB_ROOT"

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Setup Java JDK
        if: inputs.name == 'Android'
        uses: actions/setup-java@main
        with:
          distribution: 'zulu'
          java-version: '17'

      # NovaFlare 的 Windows 版产物落在很深的长路径下，explorer 和部分 IO 层
      # 在未开启长路径支持时会失败。旧 WindowsBuild.yml 就有这一步，保留。
      - name: Enable Windows long path support
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1 -Type DWord -Force
          $check = Get-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled"
          Write-Output "LongPathsEnabled = $($check.LongPathsEnabled)"

      - name: Install libVLC
        if: contains(inputs.name, 'Linux')
        run: sudo apt-get update && sudo apt-get install -y libvlc-dev libvlccore-dev

      - name: Check GameAnalytics credentials
        if: github.repository == 'IceTheAxe/FNF-NovaFlare-Engine' && github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        shell: pwsh
        run: ./tools/check-gameanalytics-env.ps1

      # ---------- 缓存 ----------
      # 两条独立的线：
      #   nf-hxcpp-<os>-<arch>-<slug>-<run_id>   滚动 key，去掉末尾 run_id 是一条线
      #   nf-deps-<os>-<slug>-<hmm.json hash>   内容 key，依赖没变就不重复上传
      #
      # key 里必须带 slug：Android / iOS / macOS ARM64 都跑在 macos-latest 上，
      # 而 runner.arch 对它们是同一个值（宿主架构），光靠 os+arch 区分不开 ——
      # 几个目标会抢同一个 key，只有一个 save 得进去，其余的全白编。
      # macOS x86_64 虽然换了 runner（macos-26，最后一个 Intel 镜像），slug 同样
      # 保证它和 macOS ARM64 分属两条线。
      #
      # 另有一条"绕过"规则：dependencies_to_update 里点名了当前 target（或 all）时
      # 必须跳过依赖缓存 —— 缓存里的 export/release/android/ 就是上一次编出来的中间产物，
      # 依赖都变了还复用它，编出来的是新旧混合体。
      - name: Decide cache strategy
        id: cache_strategy
        shell: bash
        env:
          USE_CACHE: ${{ inputs.use_cache }}
          DEPS_TO_UPDATE: ${{ inputs.dependencies_to_update }}
          TARGET_SLUG: ${{ inputs.name }}
        run: |
          slug=$(echo "$TARGET_SLUG" | tr ' A-Z__' '-a-z--' | tr -cd '[:alnum:]-')
          echo "slug=$slug" >> $GITHUB_OUTPUT

          if [ "$USE_CACHE" != "true" ]; then
            echo "use_cache=false" >> $GITHUB_OUTPUT
            echo "skip_deps_cache=true" >> $GITHUB_OUTPUT
            echo "::notice::发布链：全量重编，不使用任何缓存"
            exit 0
          fi

          echo "use_cache=true" >> $GITHUB_OUTPUT
          requested=$(echo "$DEPS_TO_UPDATE" | tr '[:upper:]' '[:lower:]' | tr ',' ' ')
          if [ -z "$requested" ]; then
            echo "skip_deps_cache=false" >> $GITHUB_OUTPUT
            echo "update_libs=false" >> $GITHUB_OUTPUT
          elif [ "$requested" = "all" ] || echo " $requested " | grep -q " $slug "; then
            echo "skip_deps_cache=true" >> $GITHUB_OUTPUT
            echo "update_libs=true" >> $GITHUB_OUTPUT
            echo "::notice::$TARGET_SLUG：依赖被点名更新，跳过依赖缓存"
          else
            echo "skip_deps_cache=false" >> $GITHUB_OUTPUT
            echo "update_libs=true" >> $GITHUB_OUTPUT
            echo "libs_to_update=$requested" >> $GITHUB_OUTPUT
          fi

      # 依赖（hmm 装的库）落在 ~/haxelib（或 Windows 的 C:\haxelib）——
      # 依赖 key 取 hmm.json 的内容 hash：依赖没变就精确命中、也不会重复上传；
      # 变了自然换 key（固定 key 存不进第二遍，缓存会永远冻在第一份）。
      - name: Restore dependency cache
        if: steps.cache_strategy.outputs.skip_deps_cache == 'false'
        uses: actions/cache/restore@v4
        with:
          key: nf-deps-${{ runner.os }}-${{ steps.cache_strategy.outputs.slug }}-${{ hashFiles('hmm.json') }}
          restore-keys: |
            nf-deps-${{ runner.os }}-${{ steps.cache_strategy.outputs.slug }}-
          path: |
            .haxelib/
            ${{ env.HAXELIB_ROOT }}
            ~/.gradle

      - name: Restore hxcpp cache
        if: inputs.use_cache
        uses: actions/cache/restore@v4
        with:
          key: nf-hxcpp-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache_strategy.outputs.slug }}-${{ github.run_id }}
          restore-keys: |
            nf-hxcpp-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache_strategy.outputs.slug }}-
          path: .hxcpp_cache

      # 装依赖的逻辑对所有目标其实是一样的（hmm + hmm.json），按平台分叉的只有
      # "haxelib 装在哪"（上面 Resolve haxelib root 已经统一了），所以这里不再让
      # matrix 传 setupCommand 进来 —— 传了就得在每个目标上重复写一遍一样的命令，
      # 改依赖安装方式时还得记得改 N 处。FE 那边沿用 setupCommand 是因为它每个平台
      # 确实跑不同的脚本（windows.bat / unix.sh），NovaFlare 没有这层脚本。
      - name: Install Libraries
        if: steps.cache_strategy.outputs.skip_deps_cache == 'true' || steps.cache_strategy.outputs.update_libs == 'true'
        shell: bash
        run: |
          set -e
          haxelib setup "$HAXELIB_ROOT"
          haxelib --global install hmm --quiet
          haxelib --global run hmm install

          # 缓存的 haxelib git checkout 会漂到上游默认分支，即使 hmm.json 钉了 commit。
          # 这四个库 NovaFlare 打过兼容补丁（polymod 的加载器、thx 的运行时改写、
          # FlxPartialSound 的部分混音），必须回到钉住的那个版本，否则编出来能跑、
          # 运行时才炸。所以**每次**装完都无条件钉一遍，不看缓存。
          for library in polymod thx.core thx.semver FlxPartialSound; do
            haxelib --global run hmm reinstall --force "$library"
          done

          if [ "${{ steps.cache_strategy.outputs.update_libs }}" = "true" ] && \
             [ "${{ steps.cache_strategy.outputs.skip_deps_cache }}" = "false" ]; then
            echo "更新指定依赖: ${{ steps.cache_strategy.outputs.libs_to_update }}"
            haxelib --global run hmm reinstall --force ${{ steps.cache_strategy.outputs.libs_to_update }}
          fi

          # 库在 haxelib 根目录，不是工作区里的 .haxelib/。
          echo "lime revision: $(git -C "$HAXELIB_ROOT/lime/git" rev-parse HEAD 2>/dev/null || echo 'n/a')"
          echo "openfl revision: $(git -C "$HAXELIB_ROOT/openfl/git" rev-parse HEAD 2>/dev/null || echo 'n/a')"

      - name: Configure Android
        if: inputs.name == 'Android'
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME
          haxelib run lime config ANDROID_SETUP true

      - name: Extract current version
        id: get_version
        shell: bash
        run: |
          CURRENT_VERSION=$(sed -n 's/.*build-number="\([^"]*\)".*/\1/p' Project.xml)
          if [ -z "$CURRENT_VERSION" ]; then
            echo "::error::在 Project.xml 中未找到 build-number 属性"
            exit 1
          fi
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT

      # ★ macOS SDK 版本必须显式告诉 hxcpp，不能让它自己猜。
      #
      # hxcpp 的 toolchain/mac-toolchain.xml 用 `xcrun --sdk macosx${MACOSX_VER} clang++`
      # 取编译器，而 MACOSX_VER 由 BuildTool.hx:2198 那段代码扫描
      # $DEVELOPER_DIR/Platforms/MacOSX.platform/Developer/SDKs/ 得出。NF 用的
      # hxcpp-4.3.2-new 里那段比较是：
      #
      #     if (major_ver > major_best || minor_ver > minor_best) best = ver;
      #
      # 这个 || 是错的：主版本更小但次版本更大的旧 SDK 也会被选中。Xcode 26.6 的
      # SDKs/ 下同时存在多个目录，循环顺序一变就可能算出 "26" 而不是 "26.0"，
      # 于是 xcrun 报 `SDK "macosx26" cannot be located`，
      # 接着 `unable to find utility "clang++"` → `Error: Could not create PCH`。
      #
      # 实测 TieGao/hxcpp-4.3.2-new 与 NovaFlare-Engine-haxelib/hxcpp-4.3.2-new
      # 在 HEAD(3f50506) 是同一份代码，那段 || 比较都还在 —— 所以“合并 TieGao 的修复”
      # 实际上没有可合并的内容。正确做法是把扫描改成
      # "主版本更大才取，主版本相同再比次版本" 并兜底补 .0，已直接修进 NovaFlare 的 fork。
      # 这里作为更稳的一道保险：BuildTool.hx:2198 的条件是 `!defines.exists("MACOSX_VER")`，
      # 只要外部定义了它，hxcpp 就会跳过那段猜测 —— 但本步传入的值必须是规范全版本
      # （如 26.0），不能是 26，否则 xcodebuild -sdk macosx26 照样报 cannot be located。
      #
      # 覆盖所有 macOS 目标（macOS 两档 + iOS）：它们都要链 clang++，
      # 都要走 toolchain/mac-toolchain.xml。
      - name: Resolve macOS SDK version
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -e
          # 用 xcodebuild -showsdks 拿“规范 SDK 名”（例如 macosx26.0），这是 xcodebuild
          # 自己认可的写法。hxcpp 拼的是 `xcodebuild -sdk macosx${MACOSX_VER}`，
          # 而 xcodebuild 对 -sdk 是“精确匹配”的：传 macosx26（缺次版本）就会报
          # `SDK "macosx26" cannot be located`。SDKs 目录里常有个 MacOSX26.sdk 软链
          # 指向 MacOSX26.0.sdk，单看目录名会解析成 "26" —— 所以这里必须以 showsdks
          # 的规范名为准，并且保证带次版本。
          SDK_VER=$(xcodebuild -showsdks 2>/dev/null \
            | grep -iE '\-sdk macosx' \
            | grep -oE 'macosx[0-9]+(\.[0-9]+)?' \
            | sort -V | tail -1 | sed 's/^macosx//')

          # 兜底：showsdks 拿不到，就扫 SDKs 目录取版本号最高的（realpath 解析软链）。
          if [ -z "$SDK_VER" ]; then
            DEV=$(xcode-select -p)
            SDK_VER=$(ls "$DEV/Platforms/MacOSX.platform/Developer/SDKs" 2>/dev/null \
              | grep -E '^MacOSX[0-9.]+' \
              | sed -E 's/^MacOSX([0-9.]+)\.sdk$/\1/' \
              | sort -V | tail -1)
          fi

          echo "SDK_VER=$SDK_VER"

          if [ -z "$SDK_VER" ]; then
            echo "::error::无法解析 macOS SDK 版本（xcodebuild -showsdks 与 SDKs 目录都拿不到）"
            exit 1
          fi

          # 必须带次版本：xcodebuild -sdk macosx<major> 严格匹配会失败。
          case "$SDK_VER" in
            *.*) ;;
            *) SDK_VER="$SDK_VER.0" ;;
          esac

          # 拼出的 SDK 名先验一次，别等编到一半才发现 hxcpp 拼错了。
          if ! xcrun --sdk "macosx$SDK_VER" clang++ --version >/dev/null 2>&1; then
            echo "::error::xcrun 不认 SDK 'macosx$SDK_VER'（xcodebuild 当前选中的是 $(xcode-select -p)）"
            xcrun --sdk "macosx$SDK_VER" clang++ --version || true
            exit 1
          fi

          # hxcpp 从进程环境读 defines（BuildTool.runMain() 开头灌入 Sys.environment()），
          # 所以用环境变量传，不用 -D —— 后者在部分平台上会被上游拼坏。
          echo "MACOSX_VER=$SDK_VER" >> "$GITHUB_ENV"
          echo "hxcpp will use SDK: macosx$SDK_VER"

      # -always 让 hxcpp 每轮都去查内容 hash，而不是先按 mtime 判断"这个 .obj 是不是新的"。
      # 已编过的文件由 hash 命中、直接跳过，压根不调编译器。
      # CI 上 mtime 那条路必然失效：checkout 完源文件 mtime 全是"刚刚"，
      # 缓存里的 .obj 怎么比都是过期的。
      - name: Compile
        shell: bash
        env:
          BUILD_NUMBER: ${{ steps.get_version.outputs.current_version }}
        run: |
          COMMIT_SHA=$(git rev-parse --short HEAD)

          # 发布链跑在 workflow_dispatch 之下：把 -dev 换成 commit，产出可追溯的版本号。
          # CI（push / pull_request）保持 Project.xml 里的原值。
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BUILD_NUMBER="${BUILD_NUMBER/-dev/-$COMMIT_SHA}"
          fi

          EXTRA=""
          if [ "${{ inputs.use_cache }}" = "true" ]; then
            EXTRA="-always"
          fi

          haxelib run lime build ${{ inputs.buildArgs }} $EXTRA \
            -Dcommit_sha=$COMMIT_SHA -Dbuild_number="$BUILD_NUMBER"

      # 编译失败也存：hxcpp 是并行编的，报错时大部分 .obj 已经编完了，下次照样命中。
      # 失败那个文件不会留在缓存里（Compiler.compile() 在编译器返回非 0 时会删掉自己产出的 obj）。
      # key 必须和上面 restore 的**同形**，只差末尾的 run_id：restore 命中靠 restore-keys
      # 前缀匹配，save 这边少一段就永远匹配不上 —— 缓存存了，但没人读得到。
      - name: Save hxcpp cache
        if: always() && inputs.use_cache
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          key: nf-hxcpp-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache_strategy.outputs.slug }}-${{ github.run_id }}
          path: .hxcpp_cache

      # 依赖没变时 key 和上面 restore 一样、缓存已存在，save 会报"已存在"——
      # 那属于正常情况（该缓存的正是那份），continue-on-error 兜住。
      - name: Save dependency cache
        if: steps.cache_strategy.outputs.skip_deps_cache == 'false'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          key: nf-deps-${{ runner.os }}-${{ steps.cache_strategy.outputs.slug }}-${{ hashFiles('hmm.json') }}
          path: |
            .haxelib/
            ${{ env.HAXELIB_ROOT }}
            ~/.gradle

      # iOS：.ipa 本身就是 zip（Payload/xxx.app），这一步是**唯一**一次压缩。
      # 旧的 MobileBuild 在这之后还会 `zip -r ios.zip *.ipa` 再套一层 ——
      # 同一份字节压两遍，用户还得解两次才能装。现在只产 .ipa，releaser 直接当附件发。
      - name: Make IPA
        if: inputs.name == 'iOS'
        shell: bash
        run: |
          set -e
          cd export/release/ios/build/Release-iphoneos
          rm -rf Payload
          mkdir Payload
          mv *.app Payload
          # -X 去掉 zip 里的扩展属性（macOS 资源叉），装的时候少一堆 __MACOSX/ 垃圾
          zip -r -X "${{ env.PROJECT_NAME }}.ipa" Payload

      - name: Upload raw artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifactName }}
          path: ${{ inputs.artifactPath }}
          if-no-files-found: error
          # 产物已经压过（zip/apk/ipa）或本来就是二进制，再压一遍纯浪费 CPU。
          # 真正的压缩在 releaser 统一做。
          compression-level: 0
